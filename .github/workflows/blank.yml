# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          
          pip install requests

      - name: Fetch and Process News
        run: |
          python - << 'EOF'
          import os
          import re
          import requests

          # Using a free, publicly available open news API (MockY/RSS-to-JSON or similar public APIs)
          # Replace this URL with your specific news API endpoint or RSS feed parser if needed
          url = "https://newsapi.org{{ secrets.NEWS_API_KEY }}"
          
          # Fallback mockup if you do not have an API key right away
          # Simply to demonstrate functionality safely without throwing immediate HTTP errors
          feeds = ["Sports: Team wins championship!", "Tech: New AI model released.", "Travel: Top 10 beaches to visit."]
          
          try:
              # Remove the fallback if you have configured your real endpoint
              # response = requests.get(url)
              # data = response.json()
              # feeds = [article['title'] for article in data.get('articles', [])]
              pass
          except Exception as e:
              print(f"Skipping live API fetch, using baseline feed. Error: {e}")

          processed_feeds = []
          for feed in feeds:
              # Remove all non-alphanumeric characters and force lowercase (adjust as per requirements)
              clean_feed = re.sub(r'[^a-zA-Z0-9]', '', feed).lower()
              if clean_feed:
                  processed_feeds.append(clean_feed)

          # Combine feeds using the '|' separator with no spaces
          output_string = "|".join(processed_feeds)

          # Ensure the News directory exists
          os.makedirs("News", exist_ok=True)
          file_path = "News/News.txt"

          # Append or write the processed output
          with open(file_path, "a") as f:
              if os.path.getsize(file_path) > 0 if os.path.exists(file_path) else False:
                  f.write("|" + output_string)
              else:
                  f.write(output_string)
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add News/News.txt
          git diff-index --quiet HEAD || git commit -m "Automated update: Added latest news feed"
          git push
          
