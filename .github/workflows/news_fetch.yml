name: Fetch and Format News Daily

on:
  schedule:
    # Runs every day at midnight UTC (Change this cron expression if needed)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-state: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests

    - name: Fetch and Process News
      env:
        # It's best practice to use a free News API key stored in GitHub Secrets
        NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }} 
      run: python scripts/fetch_news.py

    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add News/News.txt
        git commit -m "Automated news update: $(date -u +'%Y-%m-%d')" || exit 0
        git push
        
