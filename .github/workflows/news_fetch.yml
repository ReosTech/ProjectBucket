name: Fetch Sports Tech and Travel News

on:
  schedule:
    # Runs every day at midnight (UTC). Adjust as needed.
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  fetch-and-save-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to push changes back to the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Process News Feeds
        run: |
          # Create the News directory if it doesn't exist
          mkdir -p News

          # Define RSS feed URLs (using reliable tech/travel/sports feeds as examples)
          FEEDS=(
            "https://techradar.com"
            "https://lonelyplanet.com"
            "https://espn.com"
          )

          RAW_TITLES=()

          # Fetch top 3 item titles from each feed
          for feed in "${FEEDS[@]}"; do
            TITLES=$(curl -s "$feed" | grep -oPm1 -e '(?<=<title>).*?(?=</title>)' | tail -n +2 | head -n 3)
            while IFS= read -r title; do
              if [ ! -z "$title" ]; then
                # Remove special characters and spaces, then convert to lowercase
                SANITIZED=$(echo "$title" | sed 's/[^a-zA-Z0-9]//g' | tr '[:upper:]' '[:lower:]')
                RAW_TITLES+=("$SANITIZED")
              fi
            done <<< "$TITLES"
          done

          # Join all processed titles with | and save to News/News.txt
          IFS="|"
          echo "${RAW_TITLES[*]}" > News/News.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add News/News.txt
          
          # Only commit if there are changes to avoid workflow errors
          if ! git diff --cached --quiet; then
            git commit -m "Update news feed: $(date +'%Y-%m-%d')"
            git push
          else
            echo "No new changes to commit."
          fi
          
